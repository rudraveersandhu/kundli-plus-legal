<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kundli Plus</title>
<style>
:root { --bg: #FBF3E6; --ink: #2B1612; --soft: #6E5148; --accent: #C2502A; --maroon: #5A1F1A; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", "Noto Sans Devanagari", sans-serif; }
header { background: var(--maroon); color: #FBF3E6; padding: 20px 16px; }
header a { color: #E9B864; text-decoration: none; font-weight: 600; }
header nav { max-width: 720px; margin: 0 auto; display: flex; gap: 16px; flex-wrap: wrap; align-items: baseline; }
header strong { font-size: 20px; margin-right: auto; }
main { max-width: 720px; margin: 0 auto; padding: 8px 16px 48px; }
h1 { font-size: 30px; line-height: 1.2; margin: 24px 0 8px; }
h2 { font-size: 21px; margin: 28px 0 8px; }
a { color: var(--accent); }
hr { border: 0; border-top: 1px solid #E6D2BC; margin: 40px 0; }
li { margin: 4px 0; }
footer { max-width: 720px; margin: 0 auto; padding: 0 16px 32px; color: var(--soft); font-size: 14px; }
</style>
</head>
<body>
<header><nav><strong>Kundli Plus</strong></nav></header>
<main>
<h1>Kundli Plus</h1><ul><li><a href="privacy/">Privacy policy</a> · <a href="privacy/hi/">निजता नीति</a></li><li><a href="delete-account/">Delete your account and data</a></li></ul>

<footer>Kundli Plus · 2026-10-21</footer>
</body>
</html>
